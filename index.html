<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The McNeil Family Tree</title>
<meta name="description" content="An interactive, expandable family tree of the McNeil / Neil, Inward, Buck, Woolley and A'Monge families.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ tokens ============================ */
:root{
  color-scheme: light;
  --bg:#efe3cd;
  --bg-2:#e6d7bd;
  --ink:#33261a;
  --ink-soft:#6b5844;
  --ink-faint:#8c7860;
  --card:#fbf5e9;
  --card-edge:#d3bf9d;
  --card-shadow:rgba(72,50,28,.20);
  --bark-1:#6b4c33;
  --bark-2:#4a3221;
  --leaf-1:#5c8a3c;
  --leaf-2:#7aa84f;
  --leaf-3:#3f6b32;
  --accent:#a8642c;
  --accent-soft:#f0d9bd;
  --root-1:#7d4f2a;
  --panel:#fbf5e9;
  --line:rgba(107,76,51,.22);
  --focus:#c2762f;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#141310;
    --bg-2:#1c1a15;
    --ink:#eee3d0;
    --ink-soft:#bfae95;
    --ink-faint:#8e7f6a;
    --card:#26221b;
    --card-edge:#463c2d;
    --card-shadow:rgba(0,0,0,.55);
    --bark-1:#8a6742;
    --bark-2:#5d4429;
    --leaf-1:#79ae56;
    --leaf-2:#95c46d;
    --leaf-3:#537f3d;
    --accent:#e0a061;
    --accent-soft:#3a2c1c;
    --root-1:#a06c3c;
    --panel:#221e18;
    --line:rgba(220,190,150,.20);
    --focus:#e0a061;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  height:100%;display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ============================ chrome ============================ */
header{
  position:relative;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:linear-gradient(180deg,var(--bg-2),color-mix(in srgb,var(--bg-2) 80%, transparent));
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px);flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;
  font-size:22px;letter-spacing:.01em;margin:0;white-space:nowrap;
}
.brand p{margin:0;font-size:11px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;background:var(--card);border:1px solid var(--card-edge);border-radius:999px;padding:3px}
.tabs button{
  border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;
  color:var(--ink-soft);transition:.18s;
}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff8ee;box-shadow:0 1px 4px var(--card-shadow)}
.tools{display:flex;gap:6px;align-items:center}
.tool{
  border:1px solid var(--card-edge);background:var(--card);border-radius:9px;
  padding:7px 11px;font-size:12.5px;color:var(--ink-soft);transition:.15s;white-space:nowrap;
}
.tool:hover{border-color:var(--accent);color:var(--ink)}
.search{position:relative}
.search input{
  font:inherit;font-size:13px;width:210px;padding:8px 12px 8px 32px;border-radius:9px;
  border:1px solid var(--card-edge);background:var(--card);color:var(--ink);
}
.search input:focus{outline:2px solid var(--focus);outline-offset:-1px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.results{
  position:absolute;top:calc(100% + 6px);left:0;width:320px;max-height:320px;overflow:auto;
  background:var(--panel);border:1px solid var(--card-edge);border-radius:12px;
  box-shadow:0 14px 34px var(--card-shadow);padding:6px;display:none;z-index:40;
}
.results.open{display:block}
.results button{
  display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;
  padding:8px 10px;font-size:13px;line-height:1.35;
}
.results button:hover,.results button.active{background:var(--accent-soft)}
.results .rn{font-weight:600}
.results .rd{font-size:11.5px;color:var(--ink-faint)}
.results .empty{padding:12px;font-size:13px;color:var(--ink-faint)}

/* ============================ stage ============================ */
main{position:relative;flex:1;min-height:0;overflow:hidden}
#scene{
  position:absolute;inset:0;cursor:grab;
  background:
    radial-gradient(120% 90% at 50% 108%, color-mix(in srgb,var(--leaf-3) 16%, transparent), transparent 62%),
    radial-gradient(90% 70% at 50% -10%, color-mix(in srgb,var(--bg-2) 90%, transparent), transparent 70%);
  touch-action:none;
}
#scene.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#branches{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#nodes{position:absolute;left:0;top:0}

.node{
  position:absolute;left:0;top:0;width:176px;
  transition:transform .55s cubic-bezier(.22,.9,.28,1), opacity .4s;
}
.node.enter{animation:sprout .5s cubic-bezier(.2,1.1,.3,1) both}
@keyframes sprout{from{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.72)}to{opacity:1}}
.card{
  position:relative;background:var(--card);border:1px solid var(--card-edge);
  border-radius:14px;padding:9px 11px 10px;box-shadow:0 3px 10px var(--card-shadow);
  text-align:center;transition:.18s;cursor:pointer;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 18px var(--card-shadow)}
.card.is-root{background:linear-gradient(180deg,var(--card),var(--accent-soft));border-color:var(--accent)}
.card.is-selected{outline:2px solid var(--focus);outline-offset:2px}
.card .nm{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:16.5px;font-weight:600;
  line-height:1.15;letter-spacing:.005em;
}
.card .nee{display:block;font-family:Inter,sans-serif;font-size:10.5px;color:var(--ink-faint);font-weight:400;margin-top:1px}
.card .dt{font-size:11px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em}
.card .sp{font-size:10.5px;color:var(--ink-faint);margin-top:2px;font-style:italic}
.card .tag{
  display:block;margin:7px -11px -10px;padding:4px 8px 5px;
  font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  background:var(--accent);color:#fff8ee;border-radius:0 0 13px 13px;
}
.grow{
  position:absolute;left:50%;transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;border:1px solid var(--card-edge);
  background:var(--card);display:grid;place-items:center;box-shadow:0 2px 6px var(--card-shadow);
  transition:.18s;padding:0;
}
.grow:hover{background:var(--accent);border-color:var(--accent);color:#fff8ee;transform:translateX(-50%) scale(1.12)}
.grow.up{top:-13px}
.grow.down{bottom:-13px}
.grow span{font-size:15px;line-height:1;font-weight:600;margin-top:-1px}
.count{
  position:absolute;right:-8px;top:-8px;min-width:19px;height:19px;padding:0 5px;
  border-radius:999px;background:var(--leaf-3);color:#f3fae9;font-size:10.5px;font-weight:600;
  display:grid;place-items:center;box-shadow:0 2px 5px var(--card-shadow);
}

/* ============================ panel ============================ */
#panel{
  position:absolute;top:0;right:0;bottom:0;width:372px;max-width:88vw;z-index:25;
  background:var(--panel);border-left:1px solid var(--card-edge);
  box-shadow:-16px 0 40px var(--card-shadow);
  transform:translateX(102%);transition:transform .38s cubic-bezier(.3,.9,.3,1);
  display:flex;flex-direction:column;
}
#panel.open{transform:none}
.p-head{padding:20px 20px 14px;border-bottom:1px solid var(--line);position:relative}
.p-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;margin:0 30px 2px 0;line-height:1.12}
.p-head .sub{font-size:12px;color:var(--ink-faint)}
.p-close{position:absolute;top:16px;right:14px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink-faint);padding:4px}
.p-close:hover{color:var(--ink)}
.p-body{padding:16px 20px 28px;overflow:auto;flex:1}
.row{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
.row dt{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding-top:2px}
.sect{margin-top:20px}
.sect h3{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);
  margin:0 0 8px;font-weight:600;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--card-edge);background:var(--card);border-radius:999px;
  padding:5px 11px;font-size:12.5px;transition:.15s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .yr{color:var(--ink-faint);font-size:11px;margin-left:4px}
.notes{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.55}
.notes li{position:relative;padding-left:16px;margin-bottom:7px;color:var(--ink-soft)}
.notes li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--leaf-2)}
.srcline{margin-top:22px;font-size:11.5px;color:var(--ink-faint);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
.flagline{
  margin-top:14px;font-size:12px;line-height:1.5;color:var(--ink-soft);
  background:var(--accent-soft);border-radius:10px;padding:10px 12px;
}

/* ============================ misc ============================ */
#hint{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;
  background:var(--card);border:1px solid var(--card-edge);border-radius:999px;
  padding:7px 16px;font-size:12px;color:var(--ink-soft);box-shadow:0 4px 14px var(--card-shadow);
  display:flex;gap:14px;align-items:center;white-space:nowrap;max-width:94vw;overflow:auto;
}
#hint b{font-weight:600;color:var(--ink)}
#zoom{
  position:absolute;right:16px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:6px;
  transition:right .38s cubic-bezier(.3,.9,.3,1);
}
body.panel-open #zoom{right:388px}
#zoom button{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--card-edge);
  background:var(--card);box-shadow:0 2px 8px var(--card-shadow);font-size:16px;line-height:1;
}
#zoom button:hover{border-color:var(--accent)}
#picker{
  position:absolute;left:16px;top:16px;z-index:20;width:300px;max-width:calc(100vw - 32px);
  background:var(--panel);border:1px solid var(--card-edge);border-radius:14px;
  box-shadow:0 10px 30px var(--card-shadow);padding:12px;display:none;
}
#picker.show{display:block}
#picker h3{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
#picker p{margin:0 0 8px;font-size:12px;color:var(--ink-soft);line-height:1.45}
#picker select{
  width:100%;font:inherit;font-size:13px;padding:8px 10px;border-radius:9px;
  border:1px solid var(--card-edge);background:var(--card);color:var(--ink);
}
@media (max-width:720px){
  .brand p{display:none}
  .brand h1{font-size:18px}
  .search input{width:150px}
  #panel{width:100%;top:auto;height:70vh;border-left:0;border-top:1px solid var(--card-edge);border-radius:18px 18px 0 0;transform:translateY(102%)}
  #panel.open{transform:none}
  body.panel-open #zoom{right:16px;bottom:calc(70vh + 12px)}
  .p-head h2{font-size:22px}
  #hint{display:none}
  #picker{width:calc(100vw - 32px)}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true">
      <path d="M13 30V17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
      <path d="M13 20 5 13M13 20l8-7M13 15 8 9M13 15l5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
      <circle cx="5" cy="12" r="3.4" fill="#5c8a3c"/><circle cx="21" cy="12" r="3.4" fill="#7aa84f"/>
      <circle cx="8" cy="8" r="3" fill="#7aa84f"/><circle cx="18" cy="8" r="3" fill="#3f6b32"/>
      <circle cx="13" cy="5" r="3.8" fill="#5c8a3c"/>
    </svg>
    <div>
      <h1>The McNeil Family Tree</h1>
      <p>Neil · Inward · Buck · Woolley · A&rsquo;Monge</p>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button id="tab-anc" role="tab" aria-selected="true">Ancestors</button>
    <button id="tab-des" role="tab" aria-selected="false">Wider family</button>
  </div>

  <div class="search">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="Search 250 relatives…" autocomplete="off" aria-label="Search people">
    <div class="results" id="results"></div>
  </div>

  <div class="tools">
    <button class="tool" id="btn-grow">Grow all</button>
    <button class="tool" id="btn-prune">Prune</button>
    <button class="tool" id="btn-fit">Fit</button>
    <button class="tool" id="btn-about">About</button>
  </div>
</header>

<main>
  <div id="scene">
    <div id="world">
      <svg id="branches"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <div id="picker">
    <h3>Wider family</h3>
    <p id="picker-note">Choose a couple to grow their descendants from.</p>
    <select id="progenitor"></select>
  </div>

  <div id="hint">
    <span><b>Click a card</b> for the full record</span>
    <span><b>+</b> grows the next generation</span>
    <span><b>Drag</b> to pan · <b>scroll</b> to zoom</span>
  </div>

  <div id="zoom">
    <button id="z-in" title="Zoom in">+</button>
    <button id="z-out" title="Zoom out">−</button>
    <button id="z-fit" title="Fit to screen">⤢</button>
  </div>

  <aside id="panel" aria-live="polite">
    <div class="p-head">
      <button class="p-close" id="p-close" aria-label="Close">×</button>
      <h2 id="p-name"></h2>
      <div class="sub" id="p-sub"></div>
    </div>
    <div class="p-body" id="p-body"></div>
  </aside>
</main>

<script src="data.js"></script>
<script>
/* =====================================================================
   Derived indexes
   ===================================================================== */
const CHILDREN = {};           // id -> [child ids]
for (const id in PEOPLE) CHILDREN[id] = [];
for (const id in PEOPLE) {
  const p = PEOPLE[id];
  if (p.f && CHILDREN[p.f]) CHILDREN[p.f].push(id);
  if (p.mo && CHILDREN[p.mo]) CHILDREN[p.mo].push(id);
}
const byBirth = (a, b) => (year(PEOPLE[a]) || 9999) - (year(PEOPLE[b]) || 9999);
for (const id in CHILDREN) CHILDREN[id].sort(byBirth);

function year(p){
  if (!p) return null;
  const m = (p.b || "").match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  return m ? +m[1] : null;
}
function years(p){
  const gb = (p.b || "").match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  const gd = (p.d || "").match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  if (gb && gd) return gb[1] + "–" + gd[1];
  if (gb) return "b. " + gb[1];
  if (gd) return "d. " + gd[1];
  return "";
}
function neeLabel(p){ return p.neeAs || "née"; }
function spouses(p){ return !p.sp ? [] : (Array.isArray(p.sp) ? p.sp : [p.sp]); }
function parents(id){ const p = PEOPLE[id]; return [p.f, p.mo].filter(x => x && PEOPLE[x]); }
function kids(id){
  // children of this person, plus children of their spouses (so a couple reads as one household)
  const set = new Set(CHILDREN[id] || []);
  return [...set].sort(byBirth);
}
function fullName(id){ const p = PEOPLE[id]; return p ? p.n : id; }

/* =====================================================================
   State
   ===================================================================== */
const NW = 176, VGAP = 132, HGAP = 24;
const state = {
  mode: "anc",
  ancOpen: new Set([ROOT_ID, "howard", "lynette"]),
  desOpen: new Set(),
  desRoot: PROGENITORS[0].id,
  selected: null,
  tx: 0, ty: 0, k: 1,
  seenNodes: new Set(),
  seenPaths: new Set()
};

const scene = document.getElementById("scene");
const world = document.getElementById("world");
const svg = document.getElementById("branches");
const nodeLayer = document.getElementById("nodes");

/* =====================================================================
   Layout
   ===================================================================== */
function buildAnc(id, depth, guard){
  guard = guard || new Set();
  if (guard.has(id)) return null;
  guard.add(id);
  const open = state.ancOpen.has(id);
  const ps = parents(id);
  const node = { id, depth, kids: [], w: NW, x: 0, y: -depth * VGAP,
                 hasMore: ps.length > 0, open: open && ps.length > 0 };
  if (node.open){
    let cursor = 0;
    for (const pid of ps){
      const child = buildAnc(pid, depth + 1, new Set(guard));
      if (!child) continue;
      child.offset = cursor;
      cursor += child.w + HGAP;
      node.kids.push(child);
    }
    if (node.kids.length){
      node.w = cursor - HGAP;
      const first = node.kids[0], last = node.kids[node.kids.length - 1];
      node.center = (first.offset + first.x + last.offset + last.x) / 2;
    } else { node.open = false; node.center = NW / 2; }
  } else {
    node.center = NW / 2;
  }
  node.x = Math.max(0, node.center - NW / 2);
  node.w = Math.max(node.w, NW);
  return node;
}

function buildDes(id, depth, guard){
  guard = guard || new Set();
  if (guard.has(id)) return null;
  guard.add(id);
  const open = state.desOpen.has(id);
  const ch = kids(id);
  const node = { id, depth, kids: [], w: NW, x: 0, y: depth * VGAP,
                 hasMore: ch.length > 0, open: open && ch.length > 0, childCount: ch.length };
  if (node.open){
    let cursor = 0;
    for (const cid of ch){
      const child = buildDes(cid, depth + 1, new Set(guard));
      if (!child) continue;
      child.offset = cursor;
      cursor += child.w + HGAP;
      node.kids.push(child);
    }
    if (node.kids.length){
      node.w = cursor - HGAP;
      const first = node.kids[0], last = node.kids[node.kids.length - 1];
      node.center = (first.offset + first.x + last.offset + last.x) / 2;
    } else { node.open = false; node.center = NW / 2; }
  } else {
    node.center = NW / 2;
  }
  node.x = Math.max(0, node.center - NW / 2);
  node.w = Math.max(node.w, NW);
  return node;
}

function flatten(node, ox, out){
  const abs = ox + node.x;
  out.push({ id: node.id, x: abs, y: node.y, depth: node.depth,
             open: node.open, hasMore: node.hasMore, childCount: node.childCount,
             cx: abs + NW / 2 });
  for (const k of node.kids) flatten(k, ox + (k.offset || 0), out);
  return out;
}
function edges(node, ox, out){
  const abs = ox + node.x + NW / 2;
  for (const k of node.kids){
    const kx = ox + (k.offset || 0) + k.x + NW / 2;
    out.push({ from: [abs, node.y], to: [kx, k.y], depth: node.depth,
               key: node.id + ">" + k.id, uncertain: !!PEOPLE[k.id].un && state.mode === "anc"
                     || (state.mode === "des" && !!PEOPLE[k.id].un) });
    edges(k, ox + (k.offset || 0), out);
  }
  return out;
}

/* =====================================================================
   Render
   ===================================================================== */
const NODE_H = 78;
let lastRoot = null;   // {x, y} of the root card in laid-out coordinates

function render(opts){
  opts = opts || {};
  const rootId = state.mode === "anc" ? ROOT_ID : state.desRoot;
  const tree = state.mode === "anc" ? buildAnc(rootId, 0) : buildDes(rootId, 0);
  const items = flatten(tree, 0, []);
  const links = edges(tree, 0, []);

  const xs = items.map(i => i.x), ys = items.map(i => i.y);
  const minX = Math.min(...xs) - 90, maxX = Math.max(...xs) + NW + 90;
  const minY = Math.min(...ys) - 70, maxY = Math.max(...ys) + NODE_H + 160;
  const offX = -minX, offY = -minY;
  const W = maxX - minX, H = maxY - minY;

  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  nodeLayer.style.width = W + "px"; nodeLayer.style.height = H + "px";

  /* ---- branches ---- */
  const maxDepth = Math.max(...items.map(i => i.depth), 1);
  let gfx = `<defs>
    <linearGradient id="bark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="var(--bark-2)"/><stop offset="1" stop-color="var(--bark-1)"/>
    </linearGradient>
  </defs>`;

  // trunk beneath / above the root
  const root = items.find(i => i.id === rootId);
  lastRoot = root ? { x: root.x + offX, y: root.y + offY } : null;
  if (root){
    const rx = root.cx + offX;
    const ry = root.y + offY;
    if (state.mode === "anc"){
      gfx += `<path d="M${rx} ${ry + NODE_H} C ${rx - 4} ${ry + NODE_H + 55}, ${rx + 6} ${ry + NODE_H + 90}, ${rx} ${H}"
               stroke="url(#bark)" stroke-width="20" stroke-linecap="round" fill="none" opacity=".9"/>`;
      gfx += `<ellipse cx="${rx}" cy="${H - 6}" rx="86" ry="13" fill="var(--bark-2)" opacity=".16"/>`;
    } else {
      gfx += `<path d="M${rx} ${ry} C ${rx - 4} ${ry - 40}, ${rx + 6} ${ry - 60}, ${rx} ${Math.max(6, ry - 74)}"
               stroke="url(#bark)" stroke-width="18" stroke-linecap="round" fill="none" opacity=".9"/>`;
    }
  }

  const nowPaths = new Set();
  for (const l of links){
    const x1 = l.from[0] + offX, y1 = l.from[1] + offY;
    const x2 = l.to[0] + offX, y2 = l.to[1] + offY;
    const sy = state.mode === "anc" ? y1 : y1 + NODE_H;
    const ey = state.mode === "anc" ? y2 + NODE_H : y2;
    const mid = (sy + ey) / 2;
    const d = `M${x1} ${sy} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${ey}`;
    const w = Math.max(2.2, 13 - l.depth * (10 / Math.max(3, maxDepth)));
    const fresh = !state.seenPaths.has(l.key);
    nowPaths.add(l.key);
    gfx += `<path d="${d}" stroke="url(#bark)" stroke-width="${w.toFixed(1)}"
             stroke-linecap="round" fill="none" opacity="${l.uncertain ? .55 : .92}"
             ${l.uncertain ? 'stroke-dasharray="7 7"' : ''}
             class="${fresh && !l.uncertain ? 'fresh' : ''}"/>`;
    // a couple of leaves on the branch
    const lx = x1 + (x2 - x1) * .62, ly = sy + (ey - sy) * .62;
    const tone = ["var(--leaf-1)","var(--leaf-2)","var(--leaf-3)"][(l.key.length) % 3];
    gfx += `<ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="7" ry="4"
             transform="rotate(${((l.key.charCodeAt(0)||0)%70)-35} ${lx.toFixed(1)} ${ly.toFixed(1)})"
             fill="${tone}" opacity=".8"/>`;
  }
  // slender ties between couples standing side by side
  const seenPair = new Set();
  for (const a of items){
    for (const s of spouses(PEOPLE[a.id])){
      const b = items.find(i => i.id === s);
      if (!b) continue;
      const key = [a.id, s].sort().join("|");
      if (seenPair.has(key)) continue;
      seenPair.add(key);
      if (Math.abs(a.y - b.y) > 4) continue;
      const l = Math.min(a.x, b.x) + NW, r = Math.max(a.x, b.x);
      if (r - l < 4 || r - l > 460) continue;
      const y = a.y + offY + NODE_H / 2;
      gfx += `<line x1="${l + offX}" y1="${y}" x2="${r + offX}" y2="${y}"
               stroke="var(--bark-1)" stroke-width="1.6" stroke-dasharray="3 4" opacity=".5"/>`;
    }
  }

  svg.innerHTML = gfx;
  svg.querySelectorAll("path.fresh").forEach(p => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
              { duration: 620, easing: "cubic-bezier(.25,.9,.3,1)", fill: "forwards" });
  });
  state.seenPaths = nowPaths;

  /* ---- node cards ---- */
  const present = new Set();
  const onScreen = new Set(items.map(i => i.id));
  for (const it of items){
    present.add(it.id);
    const p = PEOPLE[it.id];
    let el = nodeLayer.querySelector(`[data-id="${CSS.escape(it.id)}"]`);
    const tx = (it.x + offX) + "px", ty = (it.y + offY) + "px";
    if (!el){
      el = document.createElement("div");
      el.className = "node";
      el.dataset.id = it.id;
      el.style.setProperty("--tx", tx);
      el.style.setProperty("--ty", ty);
      if (state.seenNodes.size) el.classList.add("enter");
      nodeLayer.appendChild(el);
    }
    el.style.transform = `translate(${tx}, ${ty})`;

    // only name a spouse on the card when their own card isn't already on screen
    const spIds = spouses(p).filter(s => PEOPLE[s]);
    const sp = spIds.filter(s => !onScreen.has(s)).map(s => PEOPLE[s].n);
    const isRoot = it.id === rootId;
    const canGrow = it.hasMore;
    const dirClass = state.mode === "anc" ? "up" : "down";
    const label = state.mode === "anc" ? "parents" : "children";
    const badge = state.mode === "des" && it.childCount && !it.open
                  ? `<span class="count">${it.childCount}</span>` : "";
    el.innerHTML = `
      <div class="card${isRoot ? " is-root" : ""}${state.selected === it.id ? " is-selected" : ""}" tabindex="0" role="button">
        <span class="nm">${esc(p.n)}${p.nee ? `<span class="nee">${neeLabel(p)} ${esc(p.nee)}</span>` : ""}</span>
        <div class="dt">${years(p) || "&nbsp;"}</div>
        ${sp.length ? `<div class="sp">m. ${esc(sp[0])}${sp.length > 1 ? ` +${sp.length - 1}` : ""}</div>` : ""}
        ${badge}
        ${isRoot && state.mode === "anc" ? '<span class="tag">the tree grows from here</span>' : ""}
      </div>
      ${canGrow ? `<button class="grow ${dirClass}" title="${it.open ? "Hide" : "Show"} ${label}">
          <span>${it.open ? "−" : "+"}</span></button>` : ""}`;

    el.querySelector(".card").onclick = () => select(it.id);
    el.querySelector(".card").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(it.id); } };
    const g = el.querySelector(".grow");
    if (g) g.onclick = e => { e.stopPropagation(); toggle(it.id); };
  }
  for (const el of [...nodeLayer.children]){
    if (!present.has(el.dataset.id)){
      el.style.opacity = 0;
      el.style.transform += " scale(.8)";
      setTimeout(() => el.remove(), 260);
    }
  }
  state.seenNodes = present;

  if (opts.fit) fit();
  else applyTransform();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function toggle(id){
  const set = state.mode === "anc" ? state.ancOpen : state.desOpen;
  set.has(id) ? set.delete(id) : set.add(id);
  render();
}

/* =====================================================================
   Pan / zoom
   ===================================================================== */
function applyTransform(){
  world.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.k})`;
}
function fit(){
  const w = nodeLayer.offsetWidth || 1, h = nodeLayer.offsetHeight || 1;
  const vw = scene.clientWidth - (window.innerWidth > 720 && panel.classList.contains("open") ? 380 : 0);
  const vh = scene.clientHeight;
  const raw = Math.min(vw / (w + 60), vh / (h + 60), 1.05);
  // never zoom out past the point where names stop being readable —
  // a very wide tree is better panned than squinted at
  const FLOOR = 0.34;
  state.k = Math.max(FLOOR, raw);
  if (raw >= FLOOR){
    state.tx = (vw - w * state.k) / 2;
    state.ty = (vh - h * state.k) / 2;
  } else if (lastRoot){
    // anchor on the person the view grows from
    state.tx = vw / 2 - (lastRoot.x + NW / 2) * state.k;
    state.ty = state.mode === "anc"
      ? vh - 120 - (lastRoot.y + NODE_H) * state.k
      : 90 - lastRoot.y * state.k;
  } else {
    state.tx = (vw - w * state.k) / 2;
    state.ty = 40;
  }
  applyTransform();
}
function centerOn(id, scale){
  const el = nodeLayer.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  const m = el.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
  if (!m) return;
  const k = scale || Math.max(state.k, 0.75);
  const vw = scene.clientWidth - (window.innerWidth > 720 && panel.classList.contains("open") ? 380 : 0);
  state.k = k;
  state.tx = vw / 2 - (+m[1] + NW / 2) * k;
  state.ty = scene.clientHeight / 2 - (+m[2] + NODE_H / 2) * k;
  world.style.transition = "transform .5s cubic-bezier(.25,.9,.3,1)";
  applyTransform();
  setTimeout(() => world.style.transition = "", 520);
}

let drag = null;
scene.addEventListener("pointerdown", e => {
  if (e.target.closest(".card, .grow, #picker, #panel")) return;
  drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
  scene.classList.add("grabbing");
  scene.setPointerCapture(e.pointerId);
});
scene.addEventListener("pointermove", e => {
  if (!drag) return;
  state.tx = drag.tx + (e.clientX - drag.x);
  state.ty = drag.ty + (e.clientY - drag.y);
  applyTransform();
});
["pointerup","pointercancel"].forEach(t => scene.addEventListener(t, () => { drag = null; scene.classList.remove("grabbing"); }));
scene.addEventListener("wheel", e => {
  e.preventDefault();
  const r = scene.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0016);
  const k = Math.min(2.4, Math.max(0.1, state.k * f));
  state.tx = mx - (mx - state.tx) * (k / state.k);
  state.ty = my - (my - state.ty) * (k / state.k);
  state.k = k;
  applyTransform();
}, { passive: false });

function zoomBy(f){
  const vw = scene.clientWidth / 2, vh = scene.clientHeight / 2;
  const k = Math.min(2.4, Math.max(0.1, state.k * f));
  state.tx = vw - (vw - state.tx) * (k / state.k);
  state.ty = vh - (vh - state.ty) * (k / state.k);
  state.k = k; applyTransform();
}
document.getElementById("z-in").onclick = () => zoomBy(1.25);
document.getElementById("z-out").onclick = () => zoomBy(0.8);
document.getElementById("z-fit").onclick = fit;
document.getElementById("btn-fit").onclick = fit;
document.getElementById("btn-about").onclick = () => showAbout();

/* =====================================================================
   Detail panel
   ===================================================================== */
const panel = document.getElementById("panel");
document.getElementById("p-close").onclick = () => {
  panel.classList.remove("open");
  document.body.classList.remove("panel-open");
  state.selected = null;
  render();
};

function select(id){
  state.selected = id;
  const p = PEOPLE[id];
  document.getElementById("p-name").innerHTML =
    esc(p.n) + (p.nee ? `<br><span style="font-size:.55em;color:var(--ink-faint);font-family:Inter,sans-serif">${neeLabel(p)} ${esc(p.nee)}</span>` : "");
  document.getElementById("p-sub").textContent =
    [years(p), p.occ].filter(Boolean).join(" · ") || "Dates not recorded";

  const rows = [];
  if (p.b) rows.push(["Born", p.b]);
  if (p.m) rows.push(["Married", p.m]);
  if (p.d) rows.push(["Died", p.d]);
  if (p.occ) rows.push(["Work", p.occ]);

  const ps = parents(id);
  const sibs = new Set();
  for (const pid of ps) for (const c of CHILDREN[pid]) if (c !== id) sibs.add(c);
  const ch = kids(id);
  const sp = spouses(p).filter(s => PEOPLE[s]);

  let html = "";
  if (rows.length) html += `<dl style="margin:0">${rows.map(r =>
    `<div class="row"><dt>${r[0]}</dt><dd style="margin:0">${esc(r[1])}</dd></div>`).join("")}</dl>`;

  html += group("Married", sp);
  html += group("Parents", ps);
  html += group(sibs.size === 1 ? "Sibling" : "Siblings", [...sibs].sort(byBirth));
  html += group(ch.length === 1 ? "Child" : "Children", ch);

  if (p.no && p.no.length)
    html += `<div class="sect"><h3>Notes</h3><ul class="notes">${
      p.no.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`;

  if (p.un)
    html += `<div class="flagline"><strong>Link inferred.</strong> The sheet places this person under
      ${ps.map(fullName).map(esc).join(" and ") || "these parents"} by its layout rather than saying so
      outright. Shown as a dashed branch — worth confirming against a certificate or census.</div>`;

  if (p.src)
    html += `<div class="srcline">Source: ${p.src.split(",").map(s => esc((SOURCES[s.trim()] || s.trim()))).join("; ")}</div>`;

  document.getElementById("p-body").innerHTML = html;
  document.getElementById("p-body").scrollTop = 0;
  document.querySelectorAll("#p-body .chip").forEach(c =>
    c.onclick = () => goTo(c.dataset.go));

  panel.classList.add("open");
  document.body.classList.add("panel-open");
  render();
}

/* the About card, shown in the same panel */
function showAbout(){
  state.selected = null;
  document.getElementById("p-name").textContent = "About this tree";
  document.getElementById("p-sub").textContent =
    Object.keys(PEOPLE).length + " people · four typed sheets";
  document.getElementById("p-body").innerHTML = `
    <p style="font-size:13.5px;line-height:1.6;margin:0 0 14px;color:var(--ink-soft)">
      Everything here is transcribed from four typed family-history sheets kept in the
      family papers. Nothing has been added from outside them, and where a sheet is
      self-contradictory the original wording is kept and flagged in the person's notes.</p>
    <div class="sect"><h3>The sheets</h3><ul class="notes">${
      Object.keys(SOURCES).map(k => `<li><strong>${k}</strong> — ${esc(SOURCES[k])}</li>`).join("")}</ul></div>
    <div class="sect"><h3>Dashed branches</h3>
      <p style="font-size:13px;line-height:1.55;color:var(--ink-soft);margin:0">
        Some links are implied by where a name sits on the page rather than stated outright.
        Those are drawn as dashed branches and marked on the person's record — they are the
        first places to check against certificates and censuses.</p></div>
    <div class="sect"><h3>Where the Neil line stops</h3>
      <p style="font-size:13px;line-height:1.55;color:var(--ink-soft);margin:0">
        Thomas George Cyril Neil (b. 1913, Plaistow) is the earliest Neil on any sheet;
        his own parents are not recorded. The deep lines run through his wife's family,
        the Inwards of Swanscombe, back to 1758.</p></div>
    <div class="srcline">To add or correct someone, edit <code>data.js</code> — the tree,
      the search and every relationship on this page are derived from it.</div>`;
  panel.classList.add("open");
  document.body.classList.add("panel-open");
  render();
}

function group(title, ids){
  if (!ids || !ids.length) return "";
  return `<div class="sect"><h3>${title}</h3><div class="chips">${
    ids.map(i => {
      const q = PEOPLE[i]; if (!q) return "";
      const y = years(q);
      return `<button class="chip" data-go="${i}">${esc(q.n)}${y ? `<span class="yr">${y}</span>` : ""}</button>`;
    }).join("")}</div></div>`;
}

/* =====================================================================
   Navigation — reveal any person in whichever view can show them
   ===================================================================== */
function pathFromRootAnc(target){
  // walk ancestors of ROOT breadth-first looking for target
  const q = [[ROOT_ID, [ROOT_ID]]], seen = new Set([ROOT_ID]);
  while (q.length){
    const [cur, path] = q.shift();
    if (cur === target) return path;
    for (const p of parents(cur)) if (!seen.has(p)){ seen.add(p); q.push([p, path.concat(p)]); }
  }
  return null;
}
function topAncestorOf(id){
  let cur = id, guard = 0;
  const chain = [id];
  while (guard++ < 40){
    const ps = parents(cur);
    if (!ps.length) break;
    cur = ps[0];
    chain.push(cur);
  }
  return { top: cur, chain: chain.reverse() };
}
function goTo(id){
  if (!PEOPLE[id]) return;
  const ancPath = pathFromRootAnc(id);
  if (ancPath){
    setMode("anc", true);
    ancPath.slice(0, -1).forEach(x => state.ancOpen.add(x));
    render();
    requestAnimationFrame(() => { centerOn(id); select(id); });
    return;
  }
  // otherwise show them in the descendant explorer, rooted at the nearest
  // listed household that actually contains them
  const anc = new Set([id]);
  const stack = [id];
  while (stack.length){
    const cur = stack.pop();
    for (const p of parents(cur)) if (!anc.has(p)){ anc.add(p); stack.push(p); }
  }
  const prog = PROGENITORS.find(p => anc.has(p.id));
  const { top, chain } = topAncestorOf(id);
  state.desRoot = prog ? prog.id : top;
  setMode("des", true);
  // open every step from that root down to the person
  const opened = new Set();
  let cur = state.desRoot;
  const walk = (node, target, trail) => {
    if (node === target) return trail;
    for (const c of kids(node)){
      const r = walk(c, target, trail.concat(node));
      if (r) return r;
    }
    return null;
  };
  const trail = walk(cur, id, []);
  (trail || chain).forEach(x => opened.add(x));
  opened.forEach(x => state.desOpen.add(x));
  render();
  requestAnimationFrame(() => { centerOn(id); select(id); });
}

/* =====================================================================
   Modes
   ===================================================================== */
const tabAnc = document.getElementById("tab-anc");
const tabDes = document.getElementById("tab-des");
const picker = document.getElementById("picker");
const progenitor = document.getElementById("progenitor");

progenitor.innerHTML = PROGENITORS.map(p =>
  `<option value="${p.id}">${esc(p.label)}</option>`).join("");
progenitor.onchange = () => {
  state.desRoot = progenitor.value;
  state.desOpen = new Set([state.desRoot]);
  document.getElementById("picker-note").textContent =
    (PROGENITORS.find(p => p.id === state.desRoot) || {}).note || "";
  state.seenPaths = new Set(); state.seenNodes = new Set();
  render({ fit: true });
};

function setMode(mode, quiet){
  if (state.mode === mode && quiet) { syncTabs(); return; }
  state.mode = mode;
  syncTabs();
  if (mode === "des" && !state.desOpen.size) state.desOpen.add(state.desRoot);
  state.seenPaths = new Set(); state.seenNodes = new Set();
  nodeLayer.innerHTML = "";
  render({ fit: !quiet });
}
function syncTabs(){
  tabAnc.setAttribute("aria-selected", state.mode === "anc");
  tabDes.setAttribute("aria-selected", state.mode === "des");
  picker.classList.toggle("show", state.mode === "des");
  if (!PROGENITORS.some(p => p.id === state.desRoot)){
    // someone reached by search who heads no listed household — offer them too
    if (!progenitor.querySelector(`option[value="${CSS.escape(state.desRoot)}"]`)){
      const o = document.createElement("option");
      o.value = state.desRoot;
      o.textContent = fullName(state.desRoot) + " (unplaced on the sheets)";
      progenitor.appendChild(o);
    }
  }
  progenitor.value = state.desRoot;
  document.getElementById("picker-note").textContent =
    (PROGENITORS.find(p => p.id === state.desRoot) || {}).note || "";
}
tabAnc.onclick = () => setMode("anc");
tabDes.onclick = () => setMode("des");

document.getElementById("btn-grow").onclick = () => {
  if (state.mode === "anc"){
    const walk = (id, g) => {
      if (g.has(id)) return; g.add(id);
      state.ancOpen.add(id);
      parents(id).forEach(p => walk(p, g));
    };
    walk(ROOT_ID, new Set());
  } else {
    const walk = (id, g) => {
      if (g.has(id)) return; g.add(id);
      state.desOpen.add(id);
      kids(id).forEach(c => walk(c, g));
    };
    walk(state.desRoot, new Set());
  }
  render({ fit: true });
};
document.getElementById("btn-prune").onclick = () => {
  if (state.mode === "anc") state.ancOpen = new Set([ROOT_ID, "howard", "lynette"]);
  else state.desOpen = new Set([state.desRoot]);
  render({ fit: true });
};

/* =====================================================================
   Search
   ===================================================================== */
const q = document.getElementById("q");
const results = document.getElementById("results");
const INDEX = Object.keys(PEOPLE).map(id => ({
  id,
  hay: (PEOPLE[id].n + " " + (PEOPLE[id].nee || "") + " " + (PEOPLE[id].b || "") + " " +
        (PEOPLE[id].d || "") + " " + (PEOPLE[id].occ || "")).toLowerCase()
}));
q.placeholder = `Search ${Object.keys(PEOPLE).length} relatives…`;

let hi = -1;
function runSearch(){
  const term = q.value.trim().toLowerCase();
  if (term.length < 2){ results.classList.remove("open"); return; }
  const hits = INDEX.filter(r => r.hay.includes(term)).slice(0, 40);
  hi = -1;
  results.innerHTML = hits.length
    ? hits.map(h => {
        const p = PEOPLE[h.id];
        return `<button data-go="${h.id}"><span class="rn">${esc(p.n)}</span>
          <span class="rd">${[years(p), p.nee ? "née " + p.nee : "", p.occ || ""]
            .filter(Boolean).join(" · ")}</span></button>`;
      }).join("")
    : `<div class="empty">No one by that name on the sheets.</div>`;
  results.classList.add("open");
  results.querySelectorAll("button").forEach(b => b.onclick = () => {
    results.classList.remove("open"); q.blur(); goTo(b.dataset.go);
  });
}
q.addEventListener("input", runSearch);
q.addEventListener("focus", runSearch);
q.addEventListener("keydown", e => {
  const btns = [...results.querySelectorAll("button")];
  if (!btns.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    hi = Math.max(0, Math.min(btns.length - 1, hi + (e.key === "ArrowDown" ? 1 : -1)));
    btns.forEach((b, i) => b.classList.toggle("active", i === hi));
    btns[hi].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter"){
    e.preventDefault();
    (btns[hi] || btns[0]).click();
  } else if (e.key === "Escape"){ results.classList.remove("open"); q.blur(); }
});
document.addEventListener("click", e => {
  if (!e.target.closest(".search")) results.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && panel.classList.contains("open")) document.getElementById("p-close").click();
});

/* =====================================================================
   Go
   ===================================================================== */
window.addEventListener("resize", () => { /* keep transform, just re-clamp nothing */ });
syncTabs();
render({ fit: true });
setTimeout(() => { const h = document.getElementById("hint"); if (h) h.style.transition = "opacity .6s"; }, 10);
</script>
</body>
</html>
