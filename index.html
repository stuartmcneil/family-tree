<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The McNeil Family Tree</title>
<meta name="description" content="An interactive, expandable family tree of the McNeil / Neil, Inward, Buck, Woolley and A'Monge families, with a map of birth and death places.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ tokens ============================ */
:root{
  color-scheme: light;
  --bg:#efe3cd; --bg-2:#e6d7bd;
  --ink:#33261a; --ink-soft:#6b5844; --ink-faint:#8c7860;
  --card:#fbf5e9; --card-edge:#d3bf9d; --card-shadow:rgba(72,50,28,.20);
  --bark-1:#6b4c33; --bark-2:#4a3221;
  --leaf-1:#5c8a3c; --leaf-2:#7aa84f; --leaf-3:#3f6b32;
  --accent:#a8642c; --accent-soft:#f0d9bd;
  --panel:#fbf5e9; --line:rgba(107,76,51,.22); --focus:#c2762f;
  --sea:#c9d2cd; --land:#f2e7d1; --coast:#9d8a6c;
  --birth:#4a7c2f; --death:#a8501f;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#141310; --bg-2:#1c1a15;
    --ink:#eee3d0; --ink-soft:#bfae95; --ink-faint:#8e7f6a;
    --card:#26221b; --card-edge:#463c2d; --card-shadow:rgba(0,0,0,.55);
    --bark-1:#8a6742; --bark-2:#5d4429;
    --leaf-1:#79ae56; --leaf-2:#95c46d; --leaf-3:#537f3d;
    --accent:#e0a061; --accent-soft:#3a2c1c;
    --panel:#221e18; --line:rgba(220,190,150,.20); --focus:#e0a061;
    --sea:#141a1b; --land:#332c21; --coast:#6b5d45;
    --birth:#8cc264; --death:#e09052;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ============================ header ============================ */
header{
  position:relative;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:var(--bg-2);
  border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:22px;margin:0;white-space:nowrap}
.brand p{margin:0;font-size:11px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;background:var(--card);border:1px solid var(--card-edge);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:13px;color:var(--ink-soft);transition:.18s;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff8ee;box-shadow:0 1px 4px var(--card-shadow)}
.tools{display:flex;gap:6px;align-items:center}
.tool{border:1px solid var(--card-edge);background:var(--card);border-radius:9px;padding:7px 11px;font-size:12.5px;color:var(--ink-soft);transition:.15s;white-space:nowrap}
.tool:hover{border-color:var(--accent);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff8ee}
.search{position:relative}
.search input{font:inherit;font-size:13px;width:200px;padding:8px 12px 8px 32px;border-radius:9px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink)}
.search input:focus{outline:2px solid var(--focus);outline-offset:-1px}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;width:330px;max-height:340px;overflow:auto;background:var(--panel);border:1px solid var(--card-edge);border-radius:12px;box-shadow:0 14px 34px var(--card-shadow);padding:6px;display:none;z-index:40}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35}
.results button:hover,.results button.active{background:var(--accent-soft)}
.results .rn{font-weight:600}
.results .rd{font-size:11.5px;color:var(--ink-faint)}
.results .empty{padding:12px;font-size:13px;color:var(--ink-faint)}

/* ============================ subbar ============================ */
#subbar{
  flex:none;z-index:22;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 16px;background:color-mix(in srgb,var(--bg-2) 55%, var(--bg));
  border-bottom:1px solid var(--line);min-height:46px;
}
.seg{display:flex;border:1px solid var(--card-edge);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 13px;font-size:12.5px;color:var(--ink-soft);border-right:1px solid var(--card-edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff8ee}
select.pick{font:inherit;font-size:12.5px;padding:7px 10px;border-radius:9px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink);max-width:min(52vw,340px)}
.sublabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-right:2px}
.subnote{font-size:12px;color:var(--ink-faint);margin-left:auto;text-align:right;line-height:1.35}
.key{display:inline-flex;gap:10px;align-items:center;font-size:11.5px;color:var(--ink-faint)}
.key b{color:var(--ink-soft);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}

/* ============================ stage ============================ */
main{position:relative;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

#scene{position:absolute;inset:0;cursor:grab;
  background:radial-gradient(120% 90% at 50% 108%, color-mix(in srgb,var(--leaf-3) 16%, transparent), transparent 62%);
  touch-action:none}
#scene.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#branches{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#nodes{position:absolute;left:0;top:0}

.node{position:absolute;left:0;top:0;width:176px;transition:transform .55s cubic-bezier(.22,.9,.28,1),opacity .4s}
.node.enter{animation:sprout .5s cubic-bezier(.2,1.1,.3,1) both}
@keyframes sprout{from{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.72)}to{opacity:1}}
.card{position:relative;background:var(--card);border:1px solid var(--card-edge);border-radius:14px;padding:9px 11px 10px;box-shadow:0 3px 10px var(--card-shadow);text-align:center;transition:.18s;cursor:pointer}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 18px var(--card-shadow)}
.card.is-root{background:linear-gradient(180deg,var(--card),var(--accent-soft));border-color:var(--accent)}
.card.is-selected{outline:2px solid var(--focus);outline-offset:2px}
.card .nm{font-family:"Cormorant Garamond",Georgia,serif;font-size:16.5px;font-weight:600;line-height:1.15}
.card .nee{display:block;font-family:Inter,sans-serif;font-size:10.5px;color:var(--ink-faint);font-weight:400;margin-top:1px}
.card .dt{font-size:10.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:.01em}
.card .sp{font-size:10.5px;color:var(--ink-faint);margin-top:2px;font-style:italic}
.card .tag{display:block;margin:7px -11px -10px;padding:4px 8px 5px;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;background:var(--accent);color:#fff8ee;border-radius:0 0 13px 13px}
.grow{position:absolute;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;border:1px solid var(--card-edge);background:var(--card);display:grid;place-items:center;box-shadow:0 2px 6px var(--card-shadow);transition:.18s;padding:0}
.grow:hover{background:var(--accent);border-color:var(--accent);color:#fff8ee;transform:translateX(-50%) scale(1.12)}
.grow.up{top:-13px}
.grow.down{bottom:-13px}
.grow span{font-size:15px;line-height:1;font-weight:600;margin-top:-1px}
.count{position:absolute;right:-8px;top:-8px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--leaf-3);color:#f3fae9;font-size:10.5px;font-weight:600;display:grid;place-items:center;box-shadow:0 2px 5px var(--card-shadow)}

/* ============================ families ============================ */
#view-fam{overflow:auto;padding:22px 20px 60px}
.fam-intro{max-width:1240px;margin:0 auto 22px}
.fam-intro h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;margin:0 0 6px}
.fam-intro p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-soft);max-width:74ch}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px;max-width:1240px;margin:0 auto;align-items:start}
.pcard{background:var(--card);border:1px solid var(--card-edge);border-radius:13px;padding:12px 14px;text-align:left;transition:.15s;box-shadow:0 1px 3px var(--card-shadow)}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 18px var(--card-shadow)}
.pcard h4{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;margin:0;font-weight:600;line-height:1.2}
.pcard .nee2{font-size:11px;color:var(--ink-faint);font-weight:400}
.pcard .dates{margin-top:6px;font-size:12px;color:var(--ink-soft);line-height:1.6}
.pcard .dates i{font-style:normal;color:var(--ink-faint)}
.pcard .where{margin-top:5px;font-size:11.5px;color:var(--ink-faint);line-height:1.45}
.pcard .badges{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--card-edge);border-radius:999px;padding:2px 7px;color:var(--ink-faint)}
.fam-empty{text-align:center;color:var(--ink-faint);padding:40px;font-size:14px}

/* ============================ map ============================ */
#view-map{display:none}
#view-map.on{display:flex}
#mapstage{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--sea);cursor:grab;touch-action:none}
#mapstage.grabbing{cursor:grabbing}
#mapworld{position:absolute;left:0;top:0;display:block}
#mapworld path{fill:var(--land);stroke:var(--coast);stroke-width:.8;vector-effect:non-scaling-stroke;
  stroke-linejoin:round}
#w-fine{display:none}
#mapworld.detail #w-fine{display:inline}
#mapworld.detail .coarse-gb{display:none}
#mappins,#maplabels{position:absolute;inset:0;pointer-events:none}
#maplabels span{
  position:absolute;left:0;top:0;font-size:11px;color:var(--ink-soft);
  text-shadow:0 0 3px var(--sea),0 0 3px var(--sea),0 0 6px var(--sea);
  white-space:nowrap;font-weight:500;
}
.pin{position:absolute;left:0;top:0;padding:0;pointer-events:auto;cursor:pointer;
  border-radius:50%;border:1.5px solid rgba(255,255,255,.8);box-shadow:0 1px 5px rgba(0,0,0,.35);
  display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;line-height:1;
  transition:box-shadow .12s}
.pin:hover,.pin.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 45%, transparent),0 2px 8px rgba(0,0,0,.4);z-index:5}
.pin.approx{border-style:dashed;opacity:.85}
.pin.b{background:var(--birth)}
.pin.d{background:var(--death)}
#maplist{width:266px;flex:none;border-right:1px solid var(--card-edge);background:var(--panel);overflow:auto;padding:10px}
#maplist h3{margin:12px 6px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
#maplist h3:first-child{margin-top:2px}
.prow{display:flex;width:100%;gap:8px;align-items:baseline;border:0;background:none;border-radius:8px;padding:6px 8px;text-align:left;font-size:12.5px;transition:.13s}
.prow:hover,.prow.on{background:var(--accent-soft)}
.prow .pn{flex:1;line-height:1.3}
.prow .pc{font-size:11px;color:var(--ink-faint);white-space:nowrap}
#mapmsg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--card);border:1px solid var(--card-edge);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--ink-soft);box-shadow:0 3px 12px var(--card-shadow);display:none}
#mapmsg.show{display:block}

/* ============================ panel ============================ */
#panel{position:absolute;top:0;right:0;bottom:0;width:372px;max-width:88vw;z-index:25;background:var(--panel);border-left:1px solid var(--card-edge);box-shadow:-16px 0 40px var(--card-shadow);transform:translateX(102%);transition:transform .38s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
#panel.open{transform:none}
.p-head{padding:20px 20px 14px;border-bottom:1px solid var(--line);position:relative;flex:none}
.p-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;margin:0 30px 2px 0;line-height:1.12}
.p-head .sub{font-size:12px;color:var(--ink-faint);line-height:1.4}
.p-close{position:absolute;top:16px;right:14px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink-faint);padding:4px}
.p-close:hover{color:var(--ink)}
.p-body{padding:16px 20px 28px;overflow:auto;flex:1}
.row{display:grid;grid-template-columns:80px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
.row dt{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding-top:2px}
.sect{margin-top:20px}
.sect h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--card-edge);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;transition:.15s;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .yr{color:var(--ink-faint);font-size:11px;margin-left:4px}
.notes{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.55}
.notes li{position:relative;padding-left:16px;margin-bottom:7px;color:var(--ink-soft)}
.notes li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--leaf-2)}
.srcline{margin-top:22px;font-size:11.5px;color:var(--ink-faint);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
.flagline{margin-top:14px;font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--accent-soft);border-radius:10px;padding:10px 12px}

/* ============================ misc ============================ */
#zoom{position:absolute;right:16px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:6px;transition:right .38s cubic-bezier(.3,.9,.3,1)}
body.panel-open #zoom{right:388px}
#zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--card-edge);background:var(--card);box-shadow:0 2px 8px var(--card-shadow);font-size:16px;line-height:1}
#zoom button:hover{border-color:var(--accent)}
@media (max-width:820px){
  .brand p{display:none}
  .brand h1{font-size:18px}
  .search input{width:140px}
  .subnote{display:none}
  #maplist{position:absolute;left:0;right:0;bottom:0;top:auto;width:100%;height:40%;border-right:0;border-top:1px solid var(--card-edge);z-index:8}
  #view-map.on{display:block}
  #mapstage{position:absolute;inset:0 0 40% 0}
  #panel{width:100%;top:auto;height:70vh;border-left:0;border-top:1px solid var(--card-edge);border-radius:18px 18px 0 0;transform:translateY(102%)}
  #panel.open{transform:none}
  body.panel-open #zoom{right:16px;bottom:calc(70vh + 12px)}
  body.view-map #zoom{bottom:calc(40% + 12px)}
  body.view-map.panel-open #zoom{bottom:calc(70vh + 12px)}
  .p-head h2{font-size:22px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true">
      <path d="M13 30V17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
      <path d="M13 20 5 13M13 20l8-7M13 15 8 9M13 15l5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
      <circle cx="5" cy="12" r="3.4" fill="#5c8a3c"/><circle cx="21" cy="12" r="3.4" fill="#7aa84f"/>
      <circle cx="8" cy="8" r="3" fill="#7aa84f"/><circle cx="18" cy="8" r="3" fill="#3f6b32"/>
      <circle cx="13" cy="5" r="3.8" fill="#5c8a3c"/>
    </svg>
    <div>
      <h1>The McNeil Family Tree</h1>
      <p>Neil · Inward · Buck · Woolley · A&rsquo;Monge</p>
    </div>
  </div>

  <div class="tabs" role="tablist" id="viewtabs">
    <button role="tab" data-view="anc" aria-selected="true">Ancestors</button>
    <button role="tab" data-view="des" aria-selected="false">Wider family</button>
    <button role="tab" data-view="fam" aria-selected="false">Families</button>
    <button role="tab" data-view="map" aria-selected="false">Map</button>
  </div>

  <div class="search">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="Search…" autocomplete="off" aria-label="Search people">
    <div class="results" id="results"></div>
  </div>

  <div class="tools">
    <button class="tool" id="btn-about">About</button>
  </div>
</header>

<div id="subbar"></div>

<main>
  <div class="view on" id="view-tree">
    <div id="scene">
      <div id="world">
        <svg id="branches"></svg>
        <div id="nodes"></div>
      </div>
    </div>
  </div>

  <div class="view" id="view-fam"></div>

  <div class="view" id="view-map">
    <div id="maplist"></div>
    <div id="mapstage">
      <svg id="mapworld" width="1000" height="500" viewBox="0 0 1000 500">
        <g id="w-coarse"></g><g id="w-fine"></g>
      </svg>
      <div id="maplabels"></div>
      <div id="mappins"></div>
      <div id="mapmsg"></div>
    </div>
  </div>

  <div id="zoom">
    <button id="z-in" title="Zoom in">+</button>
    <button id="z-out" title="Zoom out">−</button>
    <button id="z-fit" title="Fit to screen">⤢</button>
  </div>

  <aside id="panel" aria-live="polite">
    <div class="p-head">
      <button class="p-close" id="p-close" aria-label="Close">×</button>
      <h2 id="p-name"></h2>
      <div class="sub" id="p-sub"></div>
    </div>
    <div class="p-body" id="p-body"></div>
  </aside>
</main>

<script src="data.js"></script>
<script>
/* =====================================================================
   Derived indexes
   ===================================================================== */
const CHILDREN = {};
for (const id in PEOPLE) CHILDREN[id] = [];
for (const id in PEOPLE){
  const p = PEOPLE[id];
  if (p.f && CHILDREN[p.f]) CHILDREN[p.f].push(id);
  if (p.mo && CHILDREN[p.mo]) CHILDREN[p.mo].push(id);
}
const PLACE_BY_KEY = {};
PLACES.forEach(p => PLACE_BY_KEY[p.k] = p);

function yr(s){ const m = (s || "").match(/\b(1[5-9]\d{2}|20\d{2})\b/); return m ? +m[1] : null; }
function anyYear(p){ return yr(p.b) || yr(p.bap) || yr(p.d) || null; }
const byBirth = (a, b) => (anyYear(PEOPLE[a]) || 9999) - (anyYear(PEOPLE[b]) || 9999);
for (const id in CHILDREN) CHILDREN[id].sort(byBirth);

/* dates, always labelled: b. born · bap. baptised · d. died */
function dateParts(p){
  const out = [];
  if (yr(p.b)) out.push("b. " + yr(p.b));
  if (yr(p.bap)) out.push("bap. " + yr(p.bap));
  if (yr(p.d)) out.push("d. " + yr(p.d));
  return out;
}
function dateShort(p){ return dateParts(p).join(" · "); }

function spouses(p){ return !p.sp ? [] : (Array.isArray(p.sp) ? p.sp : [p.sp]); }
function parents(id){ const p = PEOPLE[id]; return [p.f, p.mo].filter(x => x && PEOPLE[x]); }
function kids(id){ return (CHILDREN[id] || []).slice(); }
function fullName(id){ const p = PEOPLE[id]; return p ? p.n : id; }
function neeLabel(p){ return p.neeAs || "née"; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

/* places — resolved from the transcribed text, overridable with bp / dp */
function placeFor(text){
  if (!text) return null;
  const t = text.toLowerCase();
  for (const pl of PLACES) for (const a of pl.alias)
    if (t.includes(a.toLowerCase())) return pl;
  return null;
}
function birthPlace(p){ return p.bp ? PLACE_BY_KEY[p.bp] : (placeFor(p.b) || placeFor(p.bap)); }
function deathPlace(p){ return p.dp ? PLACE_BY_KEY[p.dp] : placeFor(p.d); }

/* families — a person counts under the name they carried and the one they were born with */
function surnamesOf(p){
  const out = [];
  const last = s => { const t = String(s).trim().split(/[\s/]+/).filter(Boolean); return t[t.length - 1] || ""; };
  out.push(last(p.n));
  if (p.nee) out.push(last(p.nee));
  return out.map(s => s.replace(/[’]/g, "'"));
}
const FAM_OF = {};
for (const id in PEOPLE){
  const sn = surnamesOf(PEOPLE[id]);
  const hits = FAMILIES.filter(f => !f.rest && f.surnames.some(s =>
    sn.some(x => x.toLowerCase() === s.replace(/[’]/g, "'").toLowerCase())));
  FAM_OF[id] = hits.length ? hits.map(f => f.k) : ["related"];
}
const FAM_MEMBERS = {};
FAMILIES.forEach(f => FAM_MEMBERS[f.k] = []);
for (const id in FAM_OF) FAM_OF[id].forEach(k => FAM_MEMBERS[k].push(id));
for (const k in FAM_MEMBERS) FAM_MEMBERS[k].sort(byBirth);

/* =====================================================================
   State
   ===================================================================== */
const NW = 176, VGAP = 132, HGAP = 24, NODE_H = 78;
const state = {
  view: "anc",
  ancOpen: new Set([ROOT_ID, "howard", "lynette"]),
  desOpen: new Set(),
  desRoot: PROGENITORS[0].id,
  fam: FAMILIES[0].k,
  famSort: "date",
  mapMode: "b",          // b | d | both
  mapFam: "all",
  mapPlace: null,
  selected: null,
  tx: 0, ty: 0, k: 1,
  mtx: 0, mty: 0, mk: 1,
  seenNodes: new Set(), seenPaths: new Set()
};

const scene = document.getElementById("scene");
const world = document.getElementById("world");
const svg = document.getElementById("branches");
const nodeLayer = document.getElementById("nodes");
const panel = document.getElementById("panel");
const subbar = document.getElementById("subbar");
const zoomBox = document.getElementById("zoom");

/* =====================================================================
   Tree layout
   ===================================================================== */
function buildAnc(id, depth, guard){
  guard = guard || new Set();
  if (guard.has(id)) return null;
  guard.add(id);
  const ps = parents(id);
  const node = { id, depth, kids: [], w: NW, x: 0, y: -depth * VGAP,
                 hasMore: ps.length > 0, open: state.ancOpen.has(id) && ps.length > 0 };
  if (node.open){
    let cursor = 0;
    for (const pid of ps){
      const c = buildAnc(pid, depth + 1, new Set(guard));
      if (!c) continue;
      c.offset = cursor; cursor += c.w + HGAP; node.kids.push(c);
    }
    if (node.kids.length){
      node.w = cursor - HGAP;
      const a = node.kids[0], b = node.kids[node.kids.length - 1];
      node.center = (a.offset + a.x + b.offset + b.x) / 2;
    } else { node.open = false; node.center = NW / 2; }
  } else node.center = NW / 2;
  node.x = Math.max(0, node.center - NW / 2);
  node.w = Math.max(node.w, NW);
  return node;
}
function buildDes(id, depth, guard){
  guard = guard || new Set();
  if (guard.has(id)) return null;
  guard.add(id);
  const ch = kids(id);
  const node = { id, depth, kids: [], w: NW, x: 0, y: depth * VGAP,
                 hasMore: ch.length > 0, open: state.desOpen.has(id) && ch.length > 0, childCount: ch.length };
  if (node.open){
    let cursor = 0;
    for (const cid of ch){
      const c = buildDes(cid, depth + 1, new Set(guard));
      if (!c) continue;
      c.offset = cursor; cursor += c.w + HGAP; node.kids.push(c);
    }
    if (node.kids.length){
      node.w = cursor - HGAP;
      const a = node.kids[0], b = node.kids[node.kids.length - 1];
      node.center = (a.offset + a.x + b.offset + b.x) / 2;
    } else { node.open = false; node.center = NW / 2; }
  } else node.center = NW / 2;
  node.x = Math.max(0, node.center - NW / 2);
  node.w = Math.max(node.w, NW);
  return node;
}
function flatten(node, ox, out){
  const abs = ox + node.x;
  out.push({ id: node.id, x: abs, y: node.y, depth: node.depth, open: node.open,
             hasMore: node.hasMore, childCount: node.childCount, cx: abs + NW / 2 });
  for (const k of node.kids) flatten(k, ox + (k.offset || 0), out);
  return out;
}
function edges(node, ox, out){
  const abs = ox + node.x + NW / 2;
  for (const k of node.kids){
    const kx = ox + (k.offset || 0) + k.x + NW / 2;
    out.push({ from: [abs, node.y], to: [kx, k.y], depth: node.depth,
               key: node.id + ">" + k.id, uncertain: !!PEOPLE[k.id].un });
    edges(k, ox + (k.offset || 0), out);
  }
  return out;
}

/* =====================================================================
   Tree render
   ===================================================================== */
let lastRoot = null;

function render(opts){
  opts = opts || {};
  if (state.view !== "anc" && state.view !== "des") return;
  const rootId = state.view === "anc" ? ROOT_ID : state.desRoot;
  const tree = state.view === "anc" ? buildAnc(rootId, 0) : buildDes(rootId, 0);
  const items = flatten(tree, 0, []);
  const links = edges(tree, 0, []);

  const xs = items.map(i => i.x), ys = items.map(i => i.y);
  const minX = Math.min(...xs) - 90, maxX = Math.max(...xs) + NW + 90;
  const minY = Math.min(...ys) - 70, maxY = Math.max(...ys) + NODE_H + 160;
  const offX = -minX, offY = -minY, W = maxX - minX, H = maxY - minY;

  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  nodeLayer.style.width = W + "px"; nodeLayer.style.height = H + "px";

  const maxDepth = Math.max(...items.map(i => i.depth), 1);
  let gfx = `<defs><linearGradient id="bark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="var(--bark-2)"/><stop offset="1" stop-color="var(--bark-1)"/>
    </linearGradient></defs>`;

  const root = items.find(i => i.id === rootId);
  lastRoot = root ? { x: root.x + offX, y: root.y + offY } : null;
  if (root){
    const rx = root.cx + offX, ry = root.y + offY;
    if (state.view === "anc"){
      gfx += `<path d="M${rx} ${ry + NODE_H} C ${rx - 4} ${ry + NODE_H + 55}, ${rx + 6} ${ry + NODE_H + 90}, ${rx} ${H}"
               stroke="url(#bark)" stroke-width="20" stroke-linecap="round" fill="none" opacity=".9"/>
              <ellipse cx="${rx}" cy="${H - 6}" rx="86" ry="13" fill="var(--bark-2)" opacity=".16"/>`;
    } else {
      gfx += `<path d="M${rx} ${ry} C ${rx - 4} ${ry - 40}, ${rx + 6} ${ry - 60}, ${rx} ${Math.max(6, ry - 74)}"
               stroke="url(#bark)" stroke-width="18" stroke-linecap="round" fill="none" opacity=".9"/>`;
    }
  }

  const nowPaths = new Set();
  for (const l of links){
    const x1 = l.from[0] + offX, y1 = l.from[1] + offY;
    const x2 = l.to[0] + offX, y2 = l.to[1] + offY;
    const sy = state.view === "anc" ? y1 : y1 + NODE_H;
    const ey = state.view === "anc" ? y2 + NODE_H : y2;
    const mid = (sy + ey) / 2;
    const w = Math.max(2.2, 13 - l.depth * (10 / Math.max(3, maxDepth)));
    const fresh = !state.seenPaths.has(l.key);
    nowPaths.add(l.key);
    gfx += `<path d="M${x1} ${sy} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${ey}"
             stroke="url(#bark)" stroke-width="${w.toFixed(1)}" stroke-linecap="round" fill="none"
             opacity="${l.uncertain ? .55 : .92}" ${l.uncertain ? 'stroke-dasharray="7 7"' : ''}
             class="${fresh && !l.uncertain ? 'fresh' : ''}"/>`;
    const lx = x1 + (x2 - x1) * .62, ly = sy + (ey - sy) * .62;
    const tone = ["var(--leaf-1)","var(--leaf-2)","var(--leaf-3)"][l.key.length % 3];
    gfx += `<ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="7" ry="4"
             transform="rotate(${((l.key.charCodeAt(0) || 0) % 70) - 35} ${lx.toFixed(1)} ${ly.toFixed(1)})"
             fill="${tone}" opacity=".8"/>`;
  }

  const seenPair = new Set();
  for (const a of items){
    for (const s of spouses(PEOPLE[a.id])){
      const b = items.find(i => i.id === s);
      if (!b) continue;
      const key = [a.id, s].sort().join("|");
      if (seenPair.has(key)) continue;
      seenPair.add(key);
      if (Math.abs(a.y - b.y) > 4) continue;
      const l = Math.min(a.x, b.x) + NW, r = Math.max(a.x, b.x);
      if (r - l < 4 || r - l > 460) continue;
      gfx += `<line x1="${l + offX}" y1="${a.y + offY + NODE_H / 2}" x2="${r + offX}" y2="${a.y + offY + NODE_H / 2}"
               stroke="var(--bark-1)" stroke-width="1.6" stroke-dasharray="3 4" opacity=".5"/>`;
    }
  }

  svg.innerHTML = gfx;
  svg.querySelectorAll("path.fresh").forEach(p => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
              { duration: 620, easing: "cubic-bezier(.25,.9,.3,1)", fill: "forwards" });
  });
  state.seenPaths = nowPaths;

  const present = new Set(), onScreen = new Set(items.map(i => i.id));
  for (const it of items){
    present.add(it.id);
    const p = PEOPLE[it.id];
    let el = nodeLayer.querySelector(`[data-id="${CSS.escape(it.id)}"]`);
    const tx = (it.x + offX) + "px", ty = (it.y + offY) + "px";
    if (!el){
      el = document.createElement("div");
      el.className = "node"; el.dataset.id = it.id;
      el.style.setProperty("--tx", tx); el.style.setProperty("--ty", ty);
      if (state.seenNodes.size) el.classList.add("enter");
      nodeLayer.appendChild(el);
    }
    el.style.transform = `translate(${tx}, ${ty})`;

    const sp = spouses(p).filter(s => PEOPLE[s] && !onScreen.has(s)).map(s => PEOPLE[s].n);
    const isRoot = it.id === rootId;
    const dirClass = state.view === "anc" ? "up" : "down";
    const label = state.view === "anc" ? "parents" : "children";
    const badge = state.view === "des" && it.childCount && !it.open
                  ? `<span class="count">${it.childCount}</span>` : "";
    el.innerHTML = `
      <div class="card${isRoot ? " is-root" : ""}${state.selected === it.id ? " is-selected" : ""}" tabindex="0" role="button">
        <span class="nm">${esc(p.n)}${p.nee ? `<span class="nee">${neeLabel(p)} ${esc(p.nee)}</span>` : ""}</span>
        <div class="dt">${dateShort(p) || "&nbsp;"}</div>
        ${sp.length ? `<div class="sp">m. ${esc(sp[0])}${sp.length > 1 ? ` +${sp.length - 1}` : ""}</div>` : ""}
        ${badge}
        ${isRoot && state.view === "anc" ? '<span class="tag">the tree grows from here</span>' : ""}
      </div>
      ${it.hasMore ? `<button class="grow ${dirClass}" title="${it.open ? "Hide" : "Show"} ${label}">
          <span>${it.open ? "−" : "+"}</span></button>` : ""}`;

    const card = el.querySelector(".card");
    card.onclick = () => select(it.id);
    card.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); select(it.id); } };
    const g = el.querySelector(".grow");
    if (g) g.onclick = e => { e.stopPropagation(); toggleNode(it.id); };
  }
  for (const el of [...nodeLayer.children]){
    if (!present.has(el.dataset.id)){
      el.style.opacity = 0;
      el.style.transform += " scale(.8)";
      setTimeout(() => el.remove(), 260);
    }
  }
  state.seenNodes = present;

  if (opts.fit) fit(); else applyTransform();
}

function toggleNode(id){
  const set = state.view === "anc" ? state.ancOpen : state.desOpen;
  set.has(id) ? set.delete(id) : set.add(id);
  render();
}

/* =====================================================================
   Tree pan / zoom
   ===================================================================== */
function panelW(){ return window.innerWidth > 820 && panel.classList.contains("open") ? 380 : 0; }
function applyTransform(){ world.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.k})`; }
function fit(){
  const w = nodeLayer.offsetWidth || 1, h = nodeLayer.offsetHeight || 1;
  const vw = scene.clientWidth - panelW(), vh = scene.clientHeight;
  const raw = Math.min(vw / (w + 60), vh / (h + 60), 1.05);
  const FLOOR = 0.34;
  state.k = Math.max(FLOOR, raw);
  if (raw >= FLOOR){
    state.tx = (vw - w * state.k) / 2;
    state.ty = (vh - h * state.k) / 2;
  } else if (lastRoot){
    state.tx = vw / 2 - (lastRoot.x + NW / 2) * state.k;
    state.ty = state.view === "anc" ? vh - 120 - (lastRoot.y + NODE_H) * state.k : 90 - lastRoot.y * state.k;
  } else { state.tx = (vw - w * state.k) / 2; state.ty = 40; }
  applyTransform();
}
function centerOn(id, scale){
  const el = nodeLayer.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  const m = el.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
  if (!m) return;
  const k = scale || Math.max(state.k, 0.75);
  state.k = k;
  state.tx = (scene.clientWidth - panelW()) / 2 - (+m[1] + NW / 2) * k;
  state.ty = scene.clientHeight / 2 - (+m[2] + NODE_H / 2) * k;
  world.style.transition = "transform .5s cubic-bezier(.25,.9,.3,1)";
  applyTransform();
  setTimeout(() => world.style.transition = "", 520);
}

function dragger(el, get, set){
  let d = null;
  el.addEventListener("pointerdown", e => {
    if (e.target.closest(".card, .grow, .pin, #panel")) return;
    const s = get(); d = { x: e.clientX, y: e.clientY, tx: s.tx, ty: s.ty };
    el.classList.add("grabbing"); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (!d) return;
    set(d.tx + (e.clientX - d.x), d.ty + (e.clientY - d.y));
  });
  ["pointerup","pointercancel"].forEach(t =>
    el.addEventListener(t, () => { d = null; el.classList.remove("grabbing"); }));
  el.addEventListener("wheel", e => {
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const s = get();
    const k = Math.min(s.max, Math.max(s.min, s.k * Math.exp(-e.deltaY * 0.0016)));
    set(mx - (mx - s.tx) * (k / s.k), my - (my - s.ty) * (k / s.k), k);
  }, { passive: false });
}
dragger(scene,
  () => ({ tx: state.tx, ty: state.ty, k: state.k, min: 0.1, max: 2.4 }),
  (tx, ty, k) => { state.tx = tx; state.ty = ty; if (k) state.k = k; applyTransform(); });

   Detail panel

  document.getElementById("p-sub").textContent =
    [dateShort(p), p.occ].filter(Boolean).join(" · ") || "No dates recorded";

  const rows = [];
  if (p.b) rows.push(["Born", p.b]);

  if (p.m) rows.push(["Married", p.m]);
  if (p.d) rows.push(["Died", p.d]);
  if (p.occ) rows.push(["Work", p.occ]);

  const ps = parents(id);
  const sibs = new Set();
  for (const pid of ps) for (const c of CHILDREN[pid]) if (c !== id) sibs.add(c);

  let html = `<div class="chips" style="margin-bottom:14px">

  if (bp || dp){
    html += `<div class="sect"><h3>On the map</h3><div class="chips">${
      (bp ? `<button class="chip" data-place="${bp.k}"><span class="dot" style="background:var(--birth)"></span>born · ${esc(bp.n)}</button>` : "") +
      (dp ? `<button class="chip" data-place="${dp.k}"><span class="dot" style="background:var(--death)"></span>died · ${esc(dp.n)}</button>` : "")
    }</div></div>`;
  }

  html += group("Married", sp);
  html += group("Parents", ps);

  const fams = FAM_OF[id].map(k => FAMILIES.find(f => f.k === k));

  if (p.no && p.no.length)
    html += `<div class="sect"><h3>Notes</h3><ul class="notes">${
      p.no.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`;

  if (p.un)
    html += `<div class="flagline"><strong>Link inferred.</strong> The sheet places this person under
      ${ps.map(fullName).map(esc).join(" and ") || "these parents"} by its layout rather than saying so
      outright. Shown as a dashed branch — worth confirming against a certificate or census.</div>`;

  if (p.src)
    html += `<div class="srcline">Source: ${p.src.split(",").map(s => esc(SOURCES[s.trim()] || s.trim())).join("; ")}</div>`;

  const body = document.getElementById("p-body");
  body.innerHTML = html;
  body.scrollTop = 0;
  body.querySelectorAll("[data-go]").forEach(c => c.onclick = () => goTo(c.dataset.go));
  body.querySelectorAll("[data-tree]").forEach(c => c.onclick = () => goTo(c.dataset.tree));
  body.querySelectorAll("[data-place]").forEach(c => c.onclick = () => showPlace(c.dataset.place, true));
  body.querySelectorAll("[data-fam]").forEach(c => c.onclick = () => { state.fam = c.dataset.fam; setView("fam"); });

  openPanel();
  render();
}

/* =====================================================================
   Navigation
   ===================================================================== */
function pathFromRootAnc(target){
  const q = [[ROOT_ID, [ROOT_ID]]], seen = new Set([ROOT_ID]);
  while (q.length){
    const [cur, path] = q.shift();
    if (cur === target) return path;
    for (const p of parents(cur)) if (!seen.has(p)){ seen.add(p); q.push([p, path.concat(p)]); }
  }
  return null;
}
function topAncestorOf(id){
  let cur = id, guard = 0; const chain = [id];
  while (guard++ < 40){
    const ps = parents(cur);
    if (!ps.length) break;
    cur = ps[0]; chain.push(cur);
  }
  return { top: cur, chain: chain.reverse() };
}
function goTo(id){
  if (!PEOPLE[id]) return;
  const ancPath = pathFromRootAnc(id);
  if (ancPath){
    ancPath.slice(0, -1).forEach(x => state.ancOpen.add(x));
    setView("anc", true);
    requestAnimationFrame(() => { centerOn(id); select(id); });
    return;
  }
  const anc = new Set([id]), stack = [id];
  while (stack.length){
    const cur = stack.pop();
    for (const p of parents(cur)) if (!anc.has(p)){ anc.add(p); stack.push(p); }
  }
  const prog = PROGENITORS.find(p => anc.has(p.id));
  const { top, chain } = topAncestorOf(id);
  state.desRoot = prog ? prog.id : top;
  const walk = (node, target, trail) => {
    if (node === target) return trail;
    for (const c of kids(node)){
      const r = walk(c, target, trail.concat(node));
      if (r) return r;
    }
    return null;
  };
  (walk(state.desRoot, id, []) || chain).forEach(x => state.desOpen.add(x));
  setView("des", true);
  requestAnimationFrame(() => { centerOn(id); select(id); });
}

/* =====================================================================
   Views

const VIEWS = { anc: "view-tree", des: "view-tree", fam: "view-fam", map: "view-map" };

function setView(v, keep){
  const wasTree = state.view === "anc" || state.view === "des";
  const changedTree = (v === "anc" || v === "des") && state.view !== v;
  state.view = v;
  document.querySelectorAll("#viewtabs button").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.view === v));
  ["view-tree","view-fam","view-map"].forEach(id =>
    document.getElementById(id).classList.toggle("on", VIEWS[v] === id));
  zoomBox.style.display = (v === "fam") ? "none" : "flex";
  document.body.classList.toggle("view-map", v === "map");
  buildSubbar();
  if (v === "anc" || v === "des"){
    if (changedTree || !wasTree){
      state.seenPaths = new Set(); state.seenNodes = new Set();
      nodeLayer.innerHTML = "";
    }
    if (v === "des" && !state.desOpen.size) state.desOpen.add(state.desRoot);
    render({ fit: !keep && changedTree });
    if (keep) render();
  } else if (v === "fam"){
    renderFamilies();
  } else if (v === "map"){
    mapReady(() => {});
  }
}
/* runs `then` once world.js is in and the map has been drawn at least once */

function mapReady(then){

function wireSubbar(){
  const g = id => document.getElementById(id);
  if (g("progenitor")){
    g("progenitor").value = state.desRoot;
    g("progenitor").onchange = e => {
      state.desRoot = e.target.value;
      state.desOpen = new Set([state.desRoot]);
      state.seenPaths = new Set(); state.seenNodes = new Set();
      nodeLayer.innerHTML = "";
      render({ fit: true });
    };
  }
  if (g("btn-grow")) g("btn-grow").onclick = () => {
    if (state.view === "anc"){
      const walk = (id, gd) => { if (gd.has(id)) return; gd.add(id); state.ancOpen.add(id); parents(id).forEach(p => walk(p, gd)); };
      walk(ROOT_ID, new Set());
    } else {
      const walk = (id, gd) => { if (gd.has(id)) return; gd.add(id); state.desOpen.add(id); kids(id).forEach(c => walk(c, gd)); };
      walk(state.desRoot, new Set());
    }
    render({ fit: true });
  };
  if (g("btn-prune")) g("btn-prune").onclick = () => {
    if (state.view === "anc") state.ancOpen = new Set([ROOT_ID, "howard", "lynette"]);
    else state.desOpen = new Set([state.desRoot]);
    render({ fit: true });
  };
  if (g("btn-fit")) g("btn-fit").onclick = fit;

  if (g("famtabs")) g("famtabs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.fam = b.dataset.fam; buildSubbar(); renderFamilies(); });
  if (g("famsort")) g("famsort").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.famSort = b.dataset.sort; buildSubbar(); renderFamilies(); });

  if (g("mapmode")) g("mapmode").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.mapMode = b.dataset.mode; buildSubbar(); renderMap(); });
  if (g("mapfam")) g("mapfam").onchange = e => { state.mapFam = e.target.value; renderMap(); };
  if (g("mapregion")) g("mapregion").querySelectorAll("button").forEach(b =>
    b.onclick = () => gotoRegion(b.dataset.r));
}

/* ---------------------------- map ---------------------------- */
const MAP_W = 1000, MAP_H = 500;
const mapstage = document.getElementById("mapstage");
const mapworld = document.getElementById("mapworld");
const mappins = document.getElementById("mappins");
const maplist = document.getElementById("maplist");
const maplabels = document.getElementById("maplabels");
let worldDrawn = false, worldTried = false, fineDrawn = false, fineTried = false;

function loadScript(src, ok, fail){
  const s = document.createElement("script");
  s.src = src; s.onload = ok; s.onerror = fail;
  document.head.appendChild(s);
}
function ensureWorld(cb){
  if (typeof WORLD !== "undefined" || worldTried){ cb(); return; }
  worldTried = true;
  loadScript("world.js", cb,
    () => { mapMsg("Couldn't load world.js — the pins still work, the coastlines don't."); cb(); });
}
/* Britain and Ireland at ten times the detail, fetched only once you zoom in far
   enough to want it — which is where nearly all of this family lived. */
function ensureFine(){
  if (fineTried) return;
  fineTried = true;
  loadScript("britain.js", () => {
    document.getElementById("w-fine").innerHTML = BRITAIN.map(d => `<path d="${d}"/>`).join("");
    fineDrawn = true;
    updateDetail();
  }, () => {});
}
function updateDetail(){
  const want = state.mk > 22;
  if (want) ensureFine();
  mapworld.classList.toggle("detail", want && fineDrawn);
}
function mapMsg(t){
  const el = document.getElementById("mapmsg");
  el.textContent = t; el.classList.toggle("show", !!t);
}
function projX(lon){ return (lon + 180) / 360 * MAP_W; }
function projY(lat){ return (90 - lat) / 180 * MAP_H; }

function mapPeople(){
  const famOK = id => state.mapFam === "all" || FAM_OF[id].includes(state.mapFam);
  const births = {}, deaths = {};
  for (const id in PEOPLE){
    if (!famOK(id)) continue;
    const p = PEOPLE[id];
    if (state.mapMode !== "d"){
      const bp = birthPlace(p);
      if (bp) (births[bp.k] = births[bp.k] || []).push(id);
    }
    if (state.mapMode !== "b"){
      const dp = deathPlace(p);
      if (dp) (deaths[dp.k] = deaths[dp.k] || []).push(id);
    }
  }
  return { births, deaths };
}

function renderMap(){
  if (!worldDrawn && typeof WORLD !== "undefined"){
    const gb = new Set(typeof WORLD_BRITISH !== "undefined" ? WORLD_BRITISH : []);
    document.getElementById("w-coarse").innerHTML =
      WORLD.map((d, i) => `<path d="${d}"${gb.has(i) ? ' class="coarse-gb"' : ""}/>`).join("");
    worldDrawn = true;
  }
  const { births, deaths } = mapPeople();
  const keys = [...new Set(Object.keys(births).concat(Object.keys(deaths)))];

  mappins.innerHTML = "";
  // busiest places last, so they sit on top where pins overlap
  keys.sort((a, b) => ((births[a] || []).length + (deaths[a] || []).length)
                    - ((births[b] || []).length + (deaths[b] || []).length));
  for (const k of keys){
    const pl = PLACE_BY_KEY[k]; if (!pl) continue;
    const nb = (births[k] || []).length, nd = (deaths[k] || []).length;
    const n = nb + nd;
    const r = 13 + Math.sqrt(Math.max(0, n - 1)) * 6;
    const el = document.createElement("button");
    el.className = "pin " + (state.mapMode === "d" || (!nb && nd) ? "d" : "b") + (pl.approx ? " approx" : "");
    el.dataset.place = k;
    el.dataset.r = r;
    el.style.width = r + "px";
    el.style.height = r + "px";
    el.title = `${pl.n} — ${nb ? nb + " born" : ""}${nb && nd ? ", " : ""}${nd ? nd + " died" : ""}`;
    if (state.mapMode === "both" && nb && nd){
      const pct = Math.round(nb / n * 100);
      el.style.background = `conic-gradient(var(--birth) 0 ${pct}%, var(--death) ${pct}% 100%)`;
    }
    if (n > 1) el.textContent = n;
    el.onclick = () => showPlace(k);
    mappins.appendChild(el);
  }
  positionPins();

  const total = keys.reduce((s, k) => s + (births[k] || []).length + (deaths[k] || []).length, 0);
  const cnt = document.getElementById("mapcount");
  if (cnt) cnt.innerHTML = `${total} recorded ${state.mapMode === "b" ? "births" : state.mapMode === "d" ? "deaths" : "births &amp; deaths"}
    across ${keys.length} places<br><span class="key"><span class="dot" style="background:var(--birth)"></span>born
    <span class="dot" style="background:var(--death)"></span>died · dashed = county only</span>`;

  // place list, grouped by region, most people first
  const byRegion = {};
  for (const k of keys){
    const pl = PLACE_BY_KEY[k];
    (byRegion[pl.r] = byRegion[pl.r] || []).push({ pl, n: (births[k] || []).length + (deaths[k] || []).length });
  }
  const order = ["England","Wales","Ireland","India","Canary Islands","Australia","United States","Canada","At sea"];
  const regions = Object.keys(byRegion).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99);
  maplist.innerHTML = regions.map(r => `<h3>${esc(r)}</h3>` +
    byRegion[r].sort((a, b) => b.n - a.n || a.pl.n.localeCompare(b.pl.n)).map(x =>
      `<button class="prow${state.mapPlace === x.pl.k ? " on" : ""}" data-place="${x.pl.k}">
        <span class="pn">${esc(x.pl.n)}</span><span class="pc">${x.n}</span></button>`).join("")).join("")
    || `<div style="padding:24px 10px;color:var(--ink-faint);font-size:13px">Nothing recorded for this filter.</div>`;
  maplist.querySelectorAll("[data-place]").forEach(b =>
    b.onclick = () => showPlace(b.dataset.place, true));
}

function positionPins(){
  for (const el of mappins.children){
    const pl = PLACE_BY_KEY[el.dataset.place];
    const x = projX(pl.lon) * state.mk + state.mtx;
    const y = projY(pl.lat) * state.mk + state.mty;
    const r = +el.dataset.r;
    el.style.transform = `translate(${(x - r / 2).toFixed(1)}px, ${(y - r / 2).toFixed(1)}px)`;
    el.style.visibility = (x < -40 || y < -40 || x > mapstage.clientWidth + 40 || y > mapstage.clientHeight + 40)
      ? "hidden" : "visible";
  }
}
/* The outlines are redrawn through the viewBox rather than a CSS transform,
   so the coastlines stay vector-sharp however far you zoom in. */
function applyMapTransform(){
  const w = mapstage.clientWidth, h = mapstage.clientHeight;
  mapworld.setAttribute("width", w);
  mapworld.setAttribute("height", h);
  mapworld.setAttribute("viewBox",
    `${(-state.mtx / state.mk).toFixed(3)} ${(-state.mty / state.mk).toFixed(3)} ${(w / state.mk).toFixed(3)} ${(h / state.mk).toFixed(3)}`);
  positionPins();
  updateDetail();
  updateLabels();
}
/* Names appear once the pins are far enough apart to read them. Busiest places
   get first claim on the space; anything that would collide is left unlabelled
   rather than overprinted. */
function updateLabels(){
  if (state.mk < 14){ maplabels.innerHTML = ""; return; }
  const cands = [...mappins.children]
    .filter(el => el.style.visibility !== "hidden")
    .map(el => {
      const pl = PLACE_BY_KEY[el.dataset.place];
      const r = +el.dataset.r;
      return { pl, r, n: +(el.textContent || 1),
               x: projX(pl.lon) * state.mk + state.mtx,
               y: projY(pl.lat) * state.mk + state.mty };
    })
    .sort((a, b) => b.n - a.n);

  // the pins themselves are obstacles: no label sits on top of one
  const placed = cands.map(c => ({ x1: c.x - c.r / 2 - 2, y1: c.y - c.r / 2 - 2,
                                   x2: c.x + c.r / 2 + 2, y2: c.y + c.r / 2 + 2 }));
  const out = [];
  const hits = (a, b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
  for (const c of cands){
    const text = c.pl.n.replace(/ \(.*\)$/, "");
    const w = text.length * 6.1 + 6, h = 15, g = c.r / 2 + 5;
    const spots = [
      [c.x + g, c.y - 7],            // right
      [c.x - g - w, c.y - 7],        // left
      [c.x - w / 2, c.y + g + 1],    // below
      [c.x - w / 2, c.y - g - h - 1] // above
    ];
    for (const [x, y] of spots){
      const box = { x1: x - 2, y1: y - 1, x2: x + w + 2, y2: y + h + 1 };
      if (placed.some(p => hits(box, p))) continue;
      placed.push(box);
      out.push(`<span style="transform:translate(${x.toFixed(0)}px,${y.toFixed(0)}px)">${esc(text)}</span>`);
      break;
    }
  }
  maplabels.innerHTML = out.join("");
}
let flyTimer = null;
function fitBox(lonMin, lonMax, latMax, latMin, pad, instant){
  pad = pad || 30;
  const x1 = projX(lonMin), x2 = projX(lonMax), y1 = projY(latMax), y2 = projY(latMin);
  const vw = mapstage.clientWidth - panelW(), vh = mapstage.clientHeight;
  const k = Math.max(0.4, Math.min(Math.min((vw - pad * 2) / (x2 - x1), (vh - pad * 2) / (y2 - y1)), 900));
  const tx = vw / 2 - (x1 + x2) / 2 * k, ty = vh / 2 - (y1 + y2) / 2 * k;
  if (instant){ state.mk = k; state.mtx = tx; state.mty = ty; applyMapTransform(); return; }
  // ease there so the jump between regions is readable
  const k0 = state.mk, x0 = state.mtx, y0 = state.mty, t0 = performance.now(), dur = 480;
  cancelAnimationFrame(flyTimer);
  const step = now => {
    const u = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - u, 3);
    state.mk = k0 * Math.pow(k / k0, e);          // scale eases geometrically
    state.mtx = x0 + (tx - x0) * e;
    state.mty = y0 + (ty - y0) * e;
    applyMapTransform();
    if (u < 1) flyTimer = requestAnimationFrame(step);
  };
  flyTimer = requestAnimationFrame(step);
}
const REGIONS = {
  world:   [-170, 178, 78, -52],
  britain: [-11, 2.4, 59.5, 49.5],
  thames:  [-0.9, 0.95, 51.85, 51.15],
  india:   [67, 97, 35, 7]
};
function gotoRegion(r){ const b = REGIONS[r] || REGIONS.world; fitBox(b[0], b[1], b[2], b[3]); }

dragger(mapstage,
  () => ({ tx: state.mtx, ty: state.mty, k: state.mk, min: 0.4, max: 400 }),
  (tx, ty, k) => { state.mtx = tx; state.mty = ty; if (k) state.mk = k; applyMapTransform(); });

function showPlace(k, zoom){
  const pl = PLACE_BY_KEY[k];
  if (!pl) return;
  if (state.view !== "map"){
    state.mapPlace = k;
    setView("map");
    mapReady(() => showPlace(k, zoom));
    return;
  }
  state.mapPlace = k;
  state.selected = null;
  if (zoom){
    const s = pl.approx ? 3.2 : 0.55;
    fitBox(pl.lon - s, pl.lon + s, pl.lat + s * 0.7, pl.lat - s * 0.7);
  }

  const born = [], died = [];
  for (const id in PEOPLE){
    const p = PEOPLE[id];
    const bp = birthPlace(p), dp = deathPlace(p);
    if (bp && bp.k === k) born.push(id);
    if (dp && dp.k === k) died.push(id);
  }
  born.sort(byBirth); died.sort(byBirth);

  document.getElementById("p-name").textContent = pl.n;
  document.getElementById("p-sub").textContent =
    `${pl.r} · ${Math.abs(pl.lat).toFixed(2)}°${pl.lat >= 0 ? "N" : "S"} ${Math.abs(pl.lon).toFixed(2)}°${pl.lon >= 0 ? "E" : "W"}`;
  document.getElementById("p-body").innerHTML =
    (pl.approx ? `<div class="flagline">The sheets give only the county or region here, so the pin sits
       at its centre rather than at a real address.</div>` : "") +
    group("Born here", born) + group("Died here", died) +
    (!born.length && !died.length ? `<p style="font-size:13px;color:var(--ink-faint)">No one recorded here.</p>` : "");
  document.getElementById("p-body").querySelectorAll("[data-go]").forEach(c =>
    c.onclick = () => select(c.dataset.go));
  openPanel();

  mappins.querySelectorAll(".pin").forEach(p => p.classList.toggle("on", p.dataset.place === k));
  maplist.querySelectorAll(".prow").forEach(p => p.classList.toggle("on", p.dataset.place === k));
}

/* =====================================================================
   Zoom buttons — act on whichever view is showing
   ===================================================================== */
function zoomBy(f){
  if (state.view === "map"){
    const vw = mapstage.clientWidth / 2, vh = mapstage.clientHeight / 2;
    const k = Math.min(400, Math.max(0.4, state.mk * f));
    state.mtx = vw - (vw - state.mtx) * (k / state.mk);
    state.mty = vh - (vh - state.mty) * (k / state.mk);
    state.mk = k; applyMapTransform();
  } else {
    const vw = scene.clientWidth / 2, vh = scene.clientHeight / 2;
    const k = Math.min(2.4, Math.max(0.1, state.k * f));
    state.tx = vw - (vw - state.tx) * (k / state.k);
    state.ty = vh - (vh - state.ty) * (k / state.k);
    state.k = k; applyTransform();
  }
}
document.getElementById("z-in").onclick = () => zoomBy(1.3);
document.getElementById("z-out").onclick = () => zoomBy(1 / 1.3);
document.getElementById("z-fit").onclick = () => state.view === "map" ? gotoRegion("world") : fit();

}));
q.placeholder = `Search ${Object.keys(PEOPLE).length} relatives…`;

let hi = -1;
function runSearch(){
  const term = q.value.trim().toLowerCase();
  if (term.length < 2){ results.classList.remove("open"); return; }
  const hits = INDEX.filter(r => r.hay.includes(term)).slice(0, 40);
  hi = -1;
  results.innerHTML = hits.length
    ? hits.map(h => {
        const p = PEOPLE[h.id];
        return `<button data-go="${h.id}"><span class="rn">${esc(p.n)}</span>
          <span class="rd">${[dateShort(p), p.nee ? neeLabel(p) + " " + p.nee : "", p.occ || ""]
            .filter(Boolean).join(" · ")}</span></button>`;
      }).join("")
    : `<div class="empty">No one by that name on the sheets.</div>`;
  results.classList.add("open");
  results.querySelectorAll("button").forEach(b => b.onclick = () => {
    results.classList.remove("open"); q.blur(); goTo(b.dataset.go);
  });
}
q.addEventListener("input", runSearch);
q.addEventListener("focus", runSearch);
q.addEventListener("keydown", e => {
  const btns = [...results.querySelectorAll("button")];
  if (!btns.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    hi = Math.max(0, Math.min(btns.length - 1, hi + (e.key === "ArrowDown" ? 1 : -1)));
    btns.forEach((b, i) => b.classList.toggle("active", i === hi));
    btns[hi].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter"){ e.preventDefault(); (btns[hi] || btns[0]).click(); }
  else if (e.key === "Escape"){ results.classList.remove("open"); q.blur(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) results.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && panel.classList.contains("open")) closePanel();
});

/* =====================================================================
   Go
   ===================================================================== */
buildSubbar();
render({ fit: true });
window.addEventListener("resize", () => { if (state.view === "map" && mapInit) applyMapTransform(); });
</script>
</body>
</html>
